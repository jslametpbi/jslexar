<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no,maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1b4b">
<title>JSLexAR — EFL Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{font-family:'Nunito',sans-serif;background:#f0f4ff;color:#0f172a;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
button,input,textarea{font-family:inherit;font-size:inherit;border:none;outline:none}
:root{--I:#4f46e5;--T:#0891b2;--G:#16a34a;--A:#d97706;--R:#ef4444;--K:#0f172a;--B:#f0f4ff;--S:#fff;--N:#1a1b4b;--D:#e2e8f0;--M:#64748b;--rd:14px;--sh:0 2px 12px rgba(15,23,42,.08)}
/* shell */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{background:var(--N);color:#fff;padding:env(safe-area-inset-top) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;min-height:calc(52px + env(safe-area-inset-top));flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:8px}
.tb-ico{width:28px;height:28px;background:linear-gradient(135deg,#7c3aed,var(--I));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tb-nm{font-family:'Syne',sans-serif;font-size:18px;letter-spacing:-1px;color:#fff}
.tb-nm span{color:#38bdf8}
.tb-chips{display:flex;gap:5px}
.chip{background:rgba(255,255,255,.13);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;color:#fff}
.scrl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
/* bottom nav */
.bnav{background:var(--S);border-top:1px solid var(--D);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;background:none;color:#94a3b8;font-size:10px;font-weight:800;padding:8px 2px 6px;touch-action:manipulation;gap:2px;cursor:pointer;transition:color .15s}
.bn .ic{font-size:22px;line-height:1}
.bn.on{color:var(--I)}
/* surfaces */
.card{background:var(--S);border:1px solid var(--D);border-radius:var(--rd);box-shadow:var(--sh);padding:16px}
.ch{font-family:'Syne',sans-serif;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.ch .sub{margin-left:auto;background:#f1f5f9;border-radius:6px;padding:3px 8px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;color:var(--M)}
/* buttons */
.btn{min-height:46px;padding:10px 18px;border-radius:11px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;touch-action:manipulation;cursor:pointer;line-height:1;background:var(--S);color:var(--K)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bi{background:var(--I);color:#fff}
.bt{background:var(--T);color:#fff}
.bg{background:var(--G);color:#fff}
.br{background:var(--R);color:#fff}
.bk{background:var(--K);color:#fff}
.bo{border:2px solid var(--D)}
.sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:36px}
.fw{width:100%}
.spin{animation:sp .8s linear infinite;display:inline-block}
/* progress bar */
.bar{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.bfill{height:100%;border-radius:999px;background:var(--I);transition:width .5s}
/* stat cards */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stc{background:var(--S);border:1px solid var(--D);border-radius:var(--rd);padding:14px;text-align:center;box-shadow:var(--sh)}
.stc em{font-size:26px;display:block;margin-bottom:5px;font-style:normal}
.stc h3{font-family:'Syne',sans-serif;font-size:20px;margin-bottom:2px}
.stc p{font-size:11px;color:var(--M);font-weight:700}
/* missions / badges */
.mr{margin-bottom:12px}
.mhd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:700}
.bdgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{background:#f8fafc;border:2px solid var(--D);border-radius:11px;padding:10px 6px;text-align:center;font-size:10px;font-weight:800;color:var(--M)}
.bdg em{font-size:20px;display:block;margin-bottom:3px;font-style:normal}
.bdg.on{background:#eef2ff;border-color:#a5b4fc;color:var(--I)}
/* AR camera */
.cam-box{position:relative;background:#000;border-radius:var(--rd);overflow:hidden;width:100%}
.cam-box video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.cam-box canvas{display:none}
.sf{position:absolute;inset:12%;border:2.5px solid rgba(255,255,255,.6);border-radius:12px;pointer-events:none}
.sc{position:absolute;width:18px;height:18px;border-color:#38bdf8;border-style:solid;border-width:0}
.sc.tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px;border-radius:4px 0 0 0}
.sc.tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px;border-radius:0 4px 0 0}
.sc.bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 4px}
.sc.br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 4px 0}
.cam-st{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
.cam-off{min-height:190px;background:#0a0b1e;border-radius:var(--rd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#94a3b8;text-align:center;padding:22px}
.err-box{background:rgba(239,68,68,.1);border-radius:10px;padding:10px 13px;font-size:13px;color:#fca5a5;line-height:1.6}
/* AR word card */
.ar-card{background:linear-gradient(135deg,var(--I),#7c3aed);border-radius:var(--rd);padding:18px;color:#fff;text-align:center;animation:fu .4s ease}
.ar-obj{font-size:64px;display:block;animation:fl 2.5s ease-in-out infinite}
.ar-wd{font-family:'Syne',sans-serif;font-size:34px;letter-spacing:-1.5px;margin:8px 0 4px}
.ar-ipa{font-size:14px;opacity:.8;margin-bottom:8px}
.ar-def{font-size:13px;opacity:.75;background:rgba(255,255,255,.13);border-radius:10px;padding:10px;margin-bottom:10px;line-height:1.6}
.ar-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ar-btn{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:9px 6px;font-size:12px;font-weight:800;cursor:pointer;touch-action:manipulation;min-height:36px;font-family:inherit}
.ar-btn:active{transform:scale(.94)}
/* word hero */
.wh{background:linear-gradient(135deg,var(--I),#7c3aed);border-radius:var(--rd);padding:20px;color:#fff;text-align:center}
.wh-obj{font-size:68px;display:block;animation:fl 2.5s ease-in-out infinite;margin-bottom:6px}
.wh-wd{font-family:'Syne',sans-serif;font-size:38px;letter-spacing:-2px;margin-bottom:4px}
.wh-ipa{font-size:15px;opacity:.8;margin-bottom:4px}
.wh-cat{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.wh-task{font-size:13px;opacity:.75;background:rgba(255,255,255,.12);border-radius:10px;padding:10px;font-style:italic;line-height:1.6}
/* learn tabs */
.ltabs{display:flex;background:#f1f5f9;border-radius:11px;padding:3px;margin-bottom:12px}
.lt{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;font-size:13px;font-weight:800;color:var(--M);cursor:pointer;transition:all .18s;font-family:inherit}
.lt.on{background:#fff;color:var(--K);box-shadow:0 1px 6px rgba(0,0,0,.1)}
/* waveform */
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:50px;background:#f8fafc;border-radius:11px;margin:10px 0}
.wb{width:4px;border-radius:2px;background:var(--I)}
.wave.idle .wb{height:6px;animation:none}
.wave.rec .wb{animation:wv .65s ease-in-out infinite}
.wave.rec .wb:nth-child(1){animation-delay:0s}.wave.rec .wb:nth-child(2){animation-delay:.06s}.wave.rec .wb:nth-child(3){animation-delay:.12s}.wave.rec .wb:nth-child(4){animation-delay:.18s}.wave.rec .wb:nth-child(5){animation-delay:.24s}.wave.rec .wb:nth-child(6){animation-delay:.30s}.wave.rec .wb:nth-child(7){animation-delay:.36s}.wave.rec .wb:nth-child(8){animation-delay:.30s}.wave.rec .wb:nth-child(9){animation-delay:.18s}.wave.rec .wb:nth-child(10){animation-delay:.12s}.wave.rec .wb:nth-child(11){animation-delay:.06s}.wave.rec .wb:nth-child(12){animation-delay:0s}
/* speak feedback */
.spkfb{background:linear-gradient(135deg,#faf5ff,#eff6ff);border:1px solid #e9d5ff;border-radius:12px;padding:14px;margin-top:10px;animation:fu .4s ease}
.spkfb-h{font-weight:800;font-size:12px;color:#7c3aed;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.spkfb p{font-size:13px;line-height:1.75;color:#374151}
.scbar{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:10px}
.scbar-n{font-family:'Syne',sans-serif;font-size:26px;color:var(--G);font-weight:800}
.scbar-l{font-size:11px;color:var(--M);font-weight:700}
/* quiz */
.qprog{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qnum{font-size:13px;color:var(--M);font-weight:700}
.qsc{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--G)}
.qobj{font-size:46px;display:block;text-align:center;margin-bottom:8px}
.qtxt{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px;line-height:1.5}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.qo{background:#f8fafc;border:2px solid var(--D);border-radius:13px;padding:13px 11px;text-align:left;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;min-height:52px;width:100%;cursor:pointer;touch-action:manipulation;font-family:inherit;color:var(--K);transition:all .15s}
.qo:active:not([disabled]){transform:scale(.96)}
.qo[disabled]{cursor:default}
.qo.ok{background:#f0fdf4;border-color:var(--G);color:var(--G)}
.qo.no{background:#fff1f2;border-color:#f87171;color:#b91c1c}
.qltr{width:26px;height:26px;border-radius:7px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.qo.ok .qltr{background:var(--G);color:#fff}
.qo.no .qltr{background:#f87171;color:#fff}
.qres{display:flex;align-items:center;gap:9px;background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px;animation:fu .3s ease}
.qres .qi{font-size:20px;flex-shrink:0}
.qexpl{font-size:13px;line-height:1.6;color:var(--K);flex:1}
.qpts{font-size:13px;font-weight:800;color:var(--G);flex-shrink:0}
/* SDL */
.sfl{margin-bottom:12px}
.sfl label{display:block;font-size:12px;font-weight:800;color:var(--M);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.sfl input,.sfl textarea{width:100%;border:2px solid var(--D);border-radius:11px;padding:11px 13px;font-size:15px;background:var(--S);color:var(--K);-webkit-appearance:none;appearance:none;resize:none;transition:border-color .2s;display:block}
.sfl input:focus,.sfl textarea:focus{border-color:var(--I);outline:none}
.garrison{background:linear-gradient(135deg,#1a1b4b,#2d2e6e);border-radius:var(--rd);padding:18px;color:#fff}
.gah{font-family:'Syne',sans-serif;font-size:15px;margin-bottom:14px;color:#e2e8f0}
.garow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.gapil{background:rgba(255,255,255,.08);border-radius:11px;padding:12px}
.gapil .gn{font-size:10px;font-weight:800;color:#a5b4fc;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.gapil b{display:block;font-size:13px;color:#fff;margin-bottom:3px}
.gapil p{font-size:11px;color:#94a3b8;line-height:1.5}
.gaq{border-left:3px solid #a5b4fc;padding-left:12px;font-size:12px;color:#94a3b8;font-style:italic;line-height:1.6}
.gaq cite{display:block;margin-top:3px;color:#a5b4fc;font-style:normal;font-weight:700}
.sdlok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:10px;animation:fu .4s ease}
.sdlok b{display:block;font-weight:800;color:#15803d;margin-bottom:6px}
.sdlok p{font-size:13px;line-height:1.75;color:#14532d}
/* cards */
.catscrl{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catscrl::-webkit-scrollbar{display:none}
.catb{border:1.5px solid var(--D);background:var(--S);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer;touch-action:manipulation;color:var(--K);font-family:inherit}
.catb.on{background:var(--I);color:#fff;border-color:var(--I)}
.srch{width:100%;border:2px solid var(--D);border-radius:11px;padding:11px 13px;font-size:15px;background:var(--S);color:var(--K);-webkit-appearance:none;margin-bottom:10px;display:block;transition:border-color .2s}
.srch:focus{border-color:var(--I);outline:none}
.fcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{background:var(--S);border:2px solid var(--D);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;touch-action:manipulation;transition:all .12s}
.fc:active{transform:scale(.96)}
.fc.on{border-color:var(--I);background:#eef2ff}
.fc .fo{font-size:28px;display:block;margin-bottom:5px}
.fc .fn{font-size:12px;font-weight:800;display:block;margin-bottom:2px;color:var(--K)}
.fc .fi{font-size:10px;color:var(--M)}
.fcbtns{display:flex;gap:4px;margin-top:6px;justify-content:center}
.fbb{border:none;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer;touch-action:manipulation;min-height:26px;font-family:inherit}
/* QR modal */
.mlov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:999;padding:18px;animation:fu .25s ease}
.mlbx{background:var(--S);border-radius:18px;padding:22px;max-width:300px;width:100%;text-align:center}
.mlbx h3{font-family:'Syne',sans-serif;font-size:18px;margin-bottom:4px}
.mlbx .mdef{font-size:13px;color:var(--M);margin-bottom:14px;line-height:1.6}
.mlbx img{width:150px;height:150px;border:2px solid var(--D);border-radius:10px;margin-bottom:12px}
.mlbx .mhnt{font-size:12px;color:var(--I);font-weight:700;margin-bottom:4px}
.mlbx .mtip{font-size:11px;color:var(--M);line-height:1.5;margin-bottom:14px}
/* desktop */
@media(min-width:720px){
  .app{flex-direction:row}
  .topbar,.bnav{display:none}
  .sidebar{width:216px;background:var(--N);display:flex;flex-direction:column;flex-shrink:0}
  .sbhd{padding:20px 15px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sbhd-row{display:flex;align-items:center;gap:10px;margin-bottom:3px}
  .sbhd-ico{width:33px;height:33px;background:linear-gradient(135deg,#7c3aed,var(--I));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .sbhd-nm{font-family:'Syne',sans-serif;font-size:19px;letter-spacing:-1px;color:#fff}
  .sbhd-nm span{color:#38bdf8}
  .sbhd-sub{font-size:11px;color:#64748b}
  .sbnav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .sbi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:transparent;color:#94a3b8;font-size:13px;font-weight:700;transition:all .18s;cursor:pointer;width:100%;text-align:left;font-family:inherit}
  .sbi:hover{background:rgba(255,255,255,.08);color:#fff}
  .sbi.on{background:rgba(99,102,241,.25);color:#fff;border-left:3px solid #a5b4fc}
  .sbi .ni{font-size:17px;width:19px;text-align:center;flex-shrink:0}
  .sbft{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
  .sbfc{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;color:#e2e8f0;margin-bottom:5px}
  .mwa{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .dtop{background:var(--S);border-bottom:1px solid var(--D);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .dtop-t{font-family:'Syne',sans-serif;font-size:16px}
  .dtop-chips{display:flex;gap:8px}
  .dchp{border-radius:8px;padding:5px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
  .scrl{padding:20px;gap:16px}
  .cam-box video{aspect-ratio:16/9}
  .fcgrid{grid-template-columns:repeat(5,1fr)}
  .garow{grid-template-columns:repeat(3,1fr)}
  .stat3{grid-template-columns:repeat(3,1fr)}
}
/* animations */
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes wv{0%,100%{height:6px}50%{height:34px}}
</style>
</head>
<body>
<!-- Loading screen -->
<div id="root"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;font-family:Nunito,sans-serif;color:#94a3b8;gap:14px;background:#1a1b4b;text-align:center;padding:20px"><div style="width:44px;height:44px;border:3px solid rgba(99,102,241,.3);border-top-color:#4f46e5;border-radius:50%;animation:sp .8s linear infinite"></div><div style="font-family:Syne,sans-serif;font-size:22px;color:#38bdf8;font-weight:800">JSLexAR</div><div style="font-size:13px;color:#64748b">Loading… (needs internet)</div></div></div>
<style>@keyframes sp{to{transform:rotate(360deg)}}</style>

<!-- UMD libraries — load BEFORE app script -->
<script src="https://cdn.jsdelivr.net/npm/preact@10.22.0/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.22.0/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<!-- App (regular script, works from file:// and any server) -->
<script>

// Globals from UMD scripts: window.preact, window.preactHooks, window.htm, window.jsQR, window.qrcode
(function() {
  if (!window.preact || !window.preactHooks || !window.htm) {
    document.getElementById('root').innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;font-family:sans-serif;color:#64748b;gap:12px;text-align:center;padding:24px">' +
      '<div style="font-size:40px">⚠️</div>' +

                      <span class="fi">${fc.ipa}</span>
                      <div class="fcbtns">
                        <button class="fbb" style=${{background:'#4f46e5',color:'#fff'}} onClick=${function(){setSel(fc);setTab('learn');}}>📖</button>
                        <button class="fbb" style=${{background:'#f1f5f9',color:'#0f172a'}} onClick=${function(){setShowQR(fc);}}>QR</button>
                      </div>
                    </div>`; })}
                </div>
              </div>`}

          </div>
        </div>

        <div class="bnav">
          ${NAV.map(function(n){ return html`
            <button key=${n.id} class=${'bn'+(tab===n.id?' on':'')} onClick=${function(){setTab(n.id);}}>
              <span class="ic">${n.ic}</span>${n.lb}
            </button>`; })}
        </div>
      </div>`;
  }

  render(html`<${App}/>`, document.getElementById('root'));
})();

</script>
</body>
</html>
